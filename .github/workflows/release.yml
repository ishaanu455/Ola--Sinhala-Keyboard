name: Build & Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'README*'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - 'LICENSE*'
      # BUG FIX: editing this workflow file (or any other .github/workflows/*.yml)
      # is a CI/tooling change, not an app change - it was still matching the push
      # trigger above (nothing excluded it) and kicking off a full build+release+
      # Telegram-notify cycle, which is why a release.yml-only commit produced a
      # real APK release. Any change under .github/ that isn't app source now
      # skips the build entirely.
      - '.github/workflows/**'
      - '.github/FUNDING.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Local Bot API server, spun up just for this job and torn down with the
    # runner when it finishes - lets the Telegram step upload files up to 2000MB
    # instead of the standard api.telegram.org bot cap of 50MB (this project's
    # APK is ~59MB, so the standard endpoint 413s on it). Needs TELEGRAM_API_ID /
    # TELEGRAM_API_HASH secrets from https://my.telegram.org (separate from the
    # bot token - these belong to your personal Telegram account).
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        ports:
          - 8081:8081
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine base version from latest release tag
        id: get_version
        run: |
          # The highest "vX.Y.Z" git tag is the authoritative record of what has
          # actually been released - unlike app/build.gradle on disk, it can never
          # go stale. If a commit is pushed without first pulling the bot's last
          # "chore: bump version" commit, build.gradle in that commit can still show
          # an older version than what's already been published; bumping from THAT
          # silently re-publishes a version number that already exists (this is why
          # a GitHub release could appear "duplicated" under the same version twice,
          # confusing the app's own update check into showing an "update" that's
          # actually the same version already installed).
          git fetch --tags --force

          LATEST_TAG_VERSION=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
            | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n 1)

          GRADLE_VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/' | tr -d '[:space:]')

          if [ -z "$LATEST_TAG_VERSION" ]; then
            # No releases yet (first ever run) - fall back to build.gradle.
            BASE_VERSION="$GRADLE_VERSION"
          else
            # Bump from whichever of the two is higher, in case build.gradle was
            # ever manually bumped ahead of the last actual release.
            BASE_VERSION=$(printf '%s\n%s\n' "$LATEST_TAG_VERSION" "$GRADLE_VERSION" \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -n 1)
          fi

          echo "current_name=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: v$LATEST_TAG_VERSION | build.gradle: $GRADLE_VERSION -> bumping from $BASE_VERSION"

      - name: Bump patch version
        id: bump_version
        run: |
          OLD_NAME="${{ steps.get_version.outputs.current_name }}"

          MAJOR=$(echo "$OLD_NAME" | cut -d. -f1)
          MINOR=$(echo "$OLD_NAME" | cut -d. -f2)
          PATCH=$(echo "$OLD_NAME" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
          # Derived purely from the new version name (MAJOR*100000 + MINOR*1000 +
          # PATCH) instead of incrementing whatever versionCode happened to be
          # sitting in build.gradle - that counter is exactly as susceptible to
          # going stale as versionName was, and a mismatched versionCode can
          # confuse installs/updates just as easily as a duplicate versionName.
          NEW_CODE=$((MAJOR * 100000 + MINOR * 1000 + NEW_PATCH))

          echo "new_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "new_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "Bumping $OLD_NAME -> $NEW_NAME ($NEW_CODE)"

          # Matches whatever versionCode/versionName is currently on disk (not
          # tied to $OLD_NAME/$OLD_CODE) since the base version above may now
          # come from a tag rather than the checked-out file's own content.
          sed -i "s/versionCode [0-9]*/versionCode $NEW_CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_NAME\"/" app/build.gradle

      - name: Commit and push bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_name }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUnicodeRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore"

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -path "*release*" | head -n 1)
          APK_NAME="Ola Keyboard-${{ steps.bump_version.outputs.new_name }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH -> $APK_NAME"
          # Logged so the actual built size is visible in the run - the Telegram
          # Bot API hard-caps direct file uploads at 50MB (413 otherwise), so this
          # is the first thing to check if the Telegram step ever fails again.
          ls -lh "$APK_NAME"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump_version.outputs.new_name }}"
          name: "v${{ steps.bump_version.outputs.new_name }}"
          body: |
            Auto-release from commit ${{ github.sha }}

            **Changes:** ${{ github.event.head_commit.message }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Posts the freshly-built APK straight to the Telegram channel as soon as the
      # GitHub Release above succeeds, so channel subscribers get the file + a
      # readable changelog without ever visiting GitHub. Uploads via the local
      # telegram-bot-api service above (not api.telegram.org directly) since this
      # app's APK is ~59MB, over the standard 50MB bot-upload cap. Requires four
      # repo secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
      #   TELEGRAM_BOT_TOKEN   - the token BotFather gave you for the bot
      #   TELEGRAM_CHANNEL_ID  - "@yourchannelusername" for a public channel, or the
      #                          numeric -100... chat id for a private one
      #   TELEGRAM_API_ID      - from https://my.telegram.org (personal account, not the bot)
      #   TELEGRAM_API_HASH    - from https://my.telegram.org (personal account, not the bot)
      - name: Notify Telegram channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
          NEW_VERSION: ${{ steps.bump_version.outputs.new_name }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Telegram captions are capped at 1024 chars - truncate defensively so a
          # long commit message can never make the API call fail outright.
          SHORT_MSG=$(printf '%s' "$COMMIT_MSG" | cut -c1-600)

          # HTML parse_mode only needs &, <, > escaped (unlike MarkdownV2, which
          # would choke on a commit message containing *, _, [, ( etc.), so this
          # stays safe regardless of what the commit message happens to contain.
          ESCAPED_MSG=$(printf '%s' "$SHORT_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          # Built with $'\n' instead of a heredoc so the YAML block-literal's own
          # indentation (this whole run: | block) can't be confused with the
          # message's line breaks - a heredoc body here would need to sit flush
          # left, which ends the YAML block early and breaks the workflow file.
          CAPTION="🎹 <b>Ola Keyboard v${NEW_VERSION}</b> is out!"$'\n\n'"📝 <b>What's new:</b>"$'\n'"${ESCAPED_MSG}"$'\n\n'"🔗 <a href=\"${RELEASE_URL}\">Full changelog on GitHub</a>"

          curl -sS -f -X POST "http://localhost:8081/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=HTML"
