name: Build & Release APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get current version from build.gradle
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/' | tr -d '[:space:]')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle | grep -o '[0-9]*' | tr -d '[:space:]')
          echo "current_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "current_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION_NAME ($VERSION_CODE)"

      - name: Bump patch version
        id: bump_version
        run: |
          OLD_NAME="${{ steps.get_version.outputs.current_name }}"
          OLD_CODE="${{ steps.get_version.outputs.current_code }}"

          MAJOR=$(echo "$OLD_NAME" | cut -d. -f1)
          MINOR=$(echo "$OLD_NAME" | cut -d. -f2)
          PATCH=$(echo "$OLD_NAME" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_CODE=$((OLD_CODE + 1))

          echo "new_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "new_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "Bumping $OLD_NAME ($OLD_CODE) -> $NEW_NAME ($NEW_CODE)"

          sed -i "s/versionCode $OLD_CODE/versionCode $NEW_CODE/" app/build.gradle
          sed -i "s/versionName \"$OLD_NAME\"/versionName \"$NEW_NAME\"/" app/build.gradle

      - name: Commit and push bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_name }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUnicodeRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore"

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -path "*release*" | head -n 1)
          APK_NAME="Ola Keyboard-${{ steps.bump_version.outputs.new_name }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH -> $APK_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump_version.outputs.new_name }}"
          name: "v${{ steps.bump_version.outputs.new_name }}"
          body: |
            Auto-release from commit ${{ github.sha }}

            **Changes:** ${{ github.event.head_commit.message }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
